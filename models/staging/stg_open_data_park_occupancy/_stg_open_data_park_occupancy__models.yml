version: 2

models:
  - name: _stg_open_data_park_occupancy__records
    description: '{{ doc("park_occupancy_description") }}'

    data_tests:
      - dbt_expectations.expect_table_columns_to_contain_set:
          name: all_columns_must_exist
          description: "Ensures staging model contains all columns in lowercase."
          arguments:
            column_list:
              - 'row_id'
              - 'year'
              - 'quarter'
              - 'car_park_number'
              - 'car_park_location'
              - 'total_available_spaces'
              - 'avg_daily_peak_occupancy'
            transform: lower

    columns:
      - name: row_id
        description: '{{ doc("park_occupancy_row_id") }}'
        data_tests:
          - unique:
              name: row_id_must_be_unique
              description: "Ensures each occupancy record has a unique row identifier."
          - not_null:
              name: row_id_must_not_be_null
              description: "Ensures every occupancy record has a row identifier."
      - name: year
        description: '{{ doc("park_occupancy_year") }}'
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: year_must_be_2025_or_later
              description: "Ensures the year is 2025 or later."
              arguments:
                min_value: 2025
        tags: [dbt_expectations]
      - name: quarter
        description: '{{ doc("park_occupancy_quarter") }}'
        data_tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              name: quarter_must_be_expected_binary
              description: "Ensures the quarter is one of Q1, Q2, Q3 or Q4."
              arguments:
                value_set:
                  - "Q1"
                  - "Q2"
                  - "Q3"
                  - "Q4"
                quote_values: true
        tags: [dbt_expectations]
      - name: car_park_number
        description: '{{ doc("park_occupancy_car_park_number") }}'
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              name: car_park_number_must_start_with_CP
              description: "Ensures the car park number starts with CP."
              arguments:
                regex: '^CP'
        tags: [dbt_expectations]
      - name: car_park_location
        description: '{{ doc("park_occupancy_car_park_location") }}'
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              name: car_park_location_must_be_between_zero_or_higher
              description: "Ensures the car park street address is valid."
              arguments:
               regex: "^[A-Za-z0-9\\s\\.,#''-]*$"
               flags: 'i'
               config:
                warn_if: ">50"
                error_if: ">5"
        tags: [dbt_expectations]
      - name: total_available_spaces
        description: '{{ doc("park_occupancy_total_available_spaces") }}'
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: total_available_spaces_must_be_between_zero_or_higher
              description: >
                  Ensures the total available parking spots is zero or positive.
              arguments:
                min_value: 0
        tags: [dbt_expectations]
      - name: avg_daily_peak_occupancy
        description: >
            .
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: avg_daily_peak_occupancy_must_be_between_zero_or_higher
              description: '{{ doc("park_occupancy_avg_daily_peak_occupancy") }}'
              arguments:
                min_value: 0
        tags: [dbt_expectations]
