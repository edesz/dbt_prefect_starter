# ============================== Project metadata ==============================

[project]
name = "dbt-prefect-duckdb-starter"
version = "0.1.0"
description = "Starter dbt project with DuckDB using Prefect for orchestration."
authors = [{name = "edesz"}]
requires-python = "== 3.13.15"

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

# ========= Specify non-essential dependencies in features ========

[tool.pixi.feature.dbt.pypi-dependencies]
# create a dbt feature
dbt-core = ">=1.12.5, <2" 
duckdb = ">=1.5.5, <2"
dbt-duckdb = ">=1.11.0, <2"
sqlfluff = ">=4.3.0, <5"
pyarrow = ">=25.0.1, <26"
polars = ">=1.44.2, <2"

[tool.pixi.feature.orchestration.pypi-dependencies]
# create a prefect dbt orchestration feature
prefect = ">=3.8.6, <4"
pydantic = ">=2.13.5, <3"
typer = ">=0.27.2, <0.28"
prefect-dbt = ">=0.7.25, <0.8"

[tool.pixi.feature.lint.pypi-dependencies]
# create a lint feature
pre-commit = ">=4.6.2, <5"

[tool.pixi.feature.website.dependencies]
# create an (empty) website feature

# ========= Specify non-essential dependencies in environments ========

[tool.pixi.environments]
# create environments that use features created above
default = { solve-group = "default" }
dbt = { features = ["default", "dbt"], solve-group = "dbt" }
prefectdbt = { features = ["default", "dbt", "orchestration"], solve-group = "prefectdbt" }
lint = { features = ["default", "dbt", "lint"], solve-group = "lint" }
docs = { features = ["website"], no-default-feature = true }

# ========================== Define tasks (shortcuts) ==========================

[tool.pixi.feature.orchestration.tasks]
# run development tasks for the prefect-dbt feature
prefect-dbt = { cmd = """
    python3 dbt_orchestrator.py --commands "{{ commands }}"
    """, depends-on = [], description="""\
    Run dbt commands with Prefect\
    """, args = ["commands"], cwd = ".", default-environment = "prefectdbt" }

[tool.pixi.feature.dbt.tasks]
# execute adhoc dbc command
dbt-cmd = { cmd = """
    dbt {{ command }}
    """, description="""\
    Execute adhoc dbt command\
    """, args = ["command"], cwd = ".", default-environment = "dbt" }
# run adhoc .sql script with DuckDB
adhocsql = { cmd = """
    python run_sql_query.py "{{ script }}"
    """, depends-on = [], description="""\
    Run ad-hoc .sql script with DuckDB\
    """, args = ["script"], cwd = ".", default-environment = "dbt" }

[tool.pixi.feature.lint.tasks]
# execute lint checks
lint = { cmd = """
    dbt deps
    && dbt parse
    && pre-commit autoupdate
    && pre-commit install
    && pre-commit run -v --all-files
    """, description="""\
    Run code checks for the linting feature\
    """, cwd = ".", default-environment = "lint" }

[tool.pixi.feature.website.tasks]
# run tasks for the documentation feature
quarto-preview = { cmd = """
    quarto preview --no-browser
    """, description="""\
    Preview documentation with Quarto\
    """, default-environment = "docs" }
quarto-render = { cmd = """
    quarto render
    """, description="""\
    Render documentation with Quarto\
    """, default-environment = "docs" }
quarto-publish-gh-pages = { cmd = """
    quarto publish gh-pages
    """, description="""\
    Create Github Actions configuration for Quarto\
    """, default-environment = "docs" }
