dbt_prefect_starter:
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('BIGQUERY_PROJECT_ID') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET') }}"
      location: "{{ env_var('BIGQUERY_LOCATION') }}"
      threads: 4
      timeout_seconds: 300

    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('BIGQUERY_PROJECT_ID') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET') }}"
      location: "{{ env_var('BIGQUERY_LOCATION') }}"
      threads: 4
      timeout_seconds: 300

  target: ci
